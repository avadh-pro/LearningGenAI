[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobagent"
version = "0.1.0"
description = "Autonomous AI/ML job search and application agent (Release 1: documents-only)"
requires-python = ">=3.13"
dependencies = [
    # Orchestration — version floors are from SPEC §3.3 and are load-bearing:
    # langchain>=1.3.3 for conditional interrupts, langgraph>=1.2 for per-node
    # timeout=, error_handler= and the RunControl drain.
    "langchain>=1.3.3",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite",
    "langchain-anthropic",
    "langchain-openai",
    # Store and API
    "sqlalchemy>=2.0",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "httpx",
    # Documents
    "beautifulsoup4",
    "lxml",
    "playwright",
    "pdfminer.six",
    "pypdf",
    "PyMuPDF",
    # Ops
    "apscheduler",
    "cryptography",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio", "ruff"]

[project.scripts]
jobagent = "jobagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:jobagent.*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
